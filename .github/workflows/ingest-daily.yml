# Runs every day at 6 AM UTC. During daylight time that is 1 AM CT / 2 AM
# ET; once DST ends in early November it is midnight CT / 1 AM ET.
# Ingests members, bills, votes, 2026 candidates, and PTR disclosures — the
# data that changes daily when Congress is in session. Also regenerates the
# activity feed and runs the health gate after ingestion.
# Members moved here from weekly after Lindsey Graham's July 2026 death sat
# in the data for a week: deaths and resignations can't wait for Sunday.

name: Daily data ingestion

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      election_state:
        description: "Election adapter to backfill, or run only due adapters"
        type: choice
        options:
          - due
          - IN
          - DE
          - FL
          - RI
          - NE
          - MI
          - WA
          - all
        default: due

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingest members
        run: npx tsx scripts/ingest/members.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest bills
        run: npx tsx scripts/ingest/bills.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      # 2026 election candidates (FEC Form 2 filers). FEC refreshes nightly;
      # challenger lists move fast in primary season.
      - name: Ingest election candidates
        if: always()
        continue-on-error: true
        run: npx tsx scripts/ingest/candidates.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

      # State-authority race records. The script reads next_check_at on normal
      # daily runs; a manual dispatch can force one adapter or every implemented adapter.
      # Every source response is hash-addressed in private Vercel Blob before
      # its parsed records are committed to Postgres.
      - name: Ingest verified election records
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ "${ELECTION_STATE}" = "due" ]; then
            npx tsx scripts/ingest/elections.ts --due
          elif [ "${ELECTION_STATE}" = "all" ]; then
            npx tsx scripts/ingest/elections.ts --backfill
          else
            npx tsx scripts/ingest/elections.ts --state="${ELECTION_STATE}" --backfill
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ELECTION_STATE: ${{ inputs.election_state || 'due' }}

      - name: Ingest votes
        run: npx tsx scripts/ingest/votes.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Daily 15-minute finance pass, added Aug 31 2026. The weekly 45m run
      # covers ~84 members per pass against a 535-member roster, so the
      # 14-day freshness target was unreachable (backlog hit 67%). The
      # script is stalest-first and resumable, and the FEC quota refills
      # between runs, so several short passes compound where one long one
      # cannot. continue-on-error: a slow FEC day shouldn't cost the rest of
      # the daily ingest.
      - name: Ingest finance committees and top contributors
        continue-on-error: true
        run: npx tsx scripts/ingest/finance-committees.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FINANCE_RUN_BUDGET_MS: "900000"

      # PTR disclosures — Senate is fast HTML, House is slower (PDF + vision).
      # continue-on-error so a flake in one chamber doesn't kill the workflow;
      # divergence audit will catch real ingest gaps.
      - name: Ingest Senate PTR disclosures
        if: always()
        continue-on-error: true
        run: npx tsx scripts/ingest/disclosures-senate.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # House PTR ingest paused deliberately Aug 31, 2026. The vision-parse
      # pipeline (Sonnet, billed per PDF) had failed 30 consecutive nightly
      # runs: one oversized McCaul filing aborted the queue mid-pass every
      # night, and oversized filings need chunking before this is rebuilt as
      # a proper feature. Senate eFD ingest above continues; parsed House
      # trades remain published. lib/health.ts PAUSED_SOURCES carries the
      # matching note. To resume, restore this step:
      #   - name: Ingest House PTR disclosures
      #     if: always()
      #     continue-on-error: true
      #     run: npx tsx scripts/ingest/disclosures-house.ts
      #     env:
      #       DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #       ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate events feed
        if: always()
        run: npx tsx scripts/ingest/generate-events.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Mark any sync_log row stuck >6h in 'running' as failed so the next
      # health check sees the true state of the world.
      - name: Cleanup stuck runs
        if: always()
        run: npx tsx scripts/cleanup-stuck-runs.ts --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Delete expired Ask data
        if: always()
        run: npx tsx scripts/cleanup-ask-data.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Compare our most-recent trade date for a curated set of high-volume
      # traders against CapitolTrades. Surfaces ingest lag we'd otherwise miss.
      - name: Audit divergence vs CapitolTrades
        if: always()
        run: npx tsx scripts/audit/divergence.ts
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Final gate: any 'crit' issue exits non-zero and fails the workflow.
      - name: Health check
        if: always()
        run: npx tsx scripts/health-check.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Clear the whole site's cache so readers see tonight's data without
      # waiting out the footer-driven 86400-second route revalidate window.
      # Only runs after a non-crit health check; a crit run leaves the old
      # cache in place rather than publishing a known-bad state immediately.
      - name: Revalidate site cache
        if: success()
        run: |
          curl -sf -X POST "https://delegationdecoded.org/api/revalidate" \
            -H "x-revalidate-secret: ${REVALIDATE_SECRET}"
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      # A job-timeout reports as cancelled, not failed, so failure() alone
      # would let the 75-minute ceiling pass silently.
      #
      # Gated on a transition, not a state: open nothing, and comment on
      # nothing, if an open ingest-failure issue for this workflow already
      # exists from the last 48 hours — that is "still broken," already
      # said once. Only a break with no recent open issue (a new failure,
      # or an old one more than 48 hours stale) opens a fresh issue. This
      # replaced a per-day title match that opened one new dated issue per
      # failed run — 54 of them across a 46-day outage, one GitHub email
      # each.
      - name: Open issue on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const status = process.env.JOB_STATUS || 'failure';
            const title = 'Daily ingest failing';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-failure',
              per_page: 100,
            });
            const cutoff = Date.now() - 48 * 60 * 60 * 1000;
            const recentOpen = open.data.find(
              (issue) => issue.title === title && new Date(issue.created_at).getTime() >= cutoff
            );
            if (recentOpen) {
              console.log(`Open issue #${recentOpen.number} already covers this within the last 48 hours; not opening or commenting again.`);
              return;
            }
            const body = [
              `Workflow: **${context.workflow}**`,
              `Outcome: \`${status}\`${status === 'cancelled' ? ' — most likely the 75-minute job timeout, so later steps never ran.' : ''}`,
              `Run: ${run}`,
              `Triggered: \`${context.eventName}\``,
              ``,
              `Check the run logs and the [/health page](https://delegationdecoded.org/health) for details.`,
              ``,
              `This issue stays open until a run succeeds; it is then closed automatically.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ingest-failure'],
            });

      # The quiet half of the transition gate: a successful run closes
      # whatever open ingest-failure issue exists for this workflow, so an
      # open issue means "broken right now," not "broke once in the past."
      - name: Close failure issue on recovery
        if: ${{ success() }}
        uses: actions/github-script@v9
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-failure',
              per_page: 100,
            });
            const title = 'Daily ingest failing';
            const existing = open.data.filter((issue) => issue.title === title);
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: ${run} succeeded.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
