# Runs every day at 6 AM UTC (midnight CT / 1 AM ET)
# Ingests members, bills, votes, 2026 candidates, and PTR disclosures — the
# data that changes daily when Congress is in session. Also regenerates the
# activity feed and runs the health gate after ingestion.
# Members moved here from weekly after Lindsey Graham's July 2026 death sat
# in the data for a week: deaths and resignations can't wait for Sunday.

name: Daily data ingestion

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Ingest members
        run: npx tsx scripts/ingest/members.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest bills
        run: npx tsx scripts/ingest/bills.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      # 2026 election candidates (FEC Form 2 filers). FEC refreshes nightly;
      # challenger lists move fast in primary season.
      - name: Ingest election candidates
        if: always()
        continue-on-error: true
        run: npx tsx scripts/ingest/candidates.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

      - name: Ingest votes
        run: npx tsx scripts/ingest/votes.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # PTR disclosures — Senate is fast HTML, House is slower (PDF + vision).
      # continue-on-error so a flake in one chamber doesn't kill the workflow;
      # divergence audit will catch real ingest gaps.
      - name: Ingest Senate PTR disclosures
        if: always()
        continue-on-error: true
        run: npx tsx scripts/ingest/disclosures-senate.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest House PTR disclosures
        if: always()
        continue-on-error: true
        run: npx tsx scripts/ingest/disclosures-house.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate events feed
        if: always()
        run: npx tsx scripts/ingest/generate-events.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Mark any sync_log row stuck >6h in 'running' as failed so the next
      # health check sees the true state of the world.
      - name: Cleanup stuck runs
        if: always()
        run: npx tsx scripts/cleanup-stuck-runs.ts --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Compare our most-recent trade date for a curated set of high-volume
      # traders against CapitolTrades. Surfaces ingest lag we'd otherwise miss.
      - name: Audit divergence vs CapitolTrades
        if: always()
        run: npx tsx scripts/audit/divergence.ts
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Final gate: any 'crit' issue exits non-zero and fails the workflow.
      - name: Health check
        if: always()
        run: npx tsx scripts/health-check.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Daily ingest failed — ${new Date().toISOString().slice(0, 10)}`;
            // Avoid issue spam: reuse the most recent open auto-issue with this label.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-failure',
              per_page: 1,
            });
            const body = [
              `Workflow: **${context.workflow}**`,
              `Run: ${run}`,
              `Triggered: \`${context.eventName}\``,
              ``,
              `Check the run logs and the [/health page](https://delegation-decoded.vercel.app/health) for details.`,
            ].join('\n');
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ingest-failure'],
              });
            }
