# Runs every Sunday at 7 AM UTC (1 AM CT / 2 AM ET)
# Ingests slower-changing data: committees, campaign finance, press releases.
# Members now ingest daily (deaths and resignations can't wait for Sunday);
# the run here is a belt-and-suspenders second pass.
# Also regenerates AI delegation briefs and runs the health gate after ingestion.

name: Weekly data ingestion

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Ingest members
        run: npx tsx scripts/ingest/members.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest committees
        run: npx tsx scripts/ingest/committees.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Ingest campaign finance
        run: npx tsx scripts/ingest/finance.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

      - name: Ingest finance committees and top contributors
        run: npx tsx scripts/ingest/finance-committees.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

      - name: Crawl verified campaign sites and queue extracted claims for review
        run: npx tsx scripts/ingest/candidate-sites.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_EXTRACT_PRIMARY_PROVIDER: openai
          CANDIDATE_EXTRACT_MAX_CANDIDATES: 8
          CANDIDATE_EXTRACT_MAX_PAGES: 5
          CANDIDATE_EXTRACT_MAX_INPUT_CHARS: 36000
          CANDIDATE_EXTRACT_MAX_PROVIDER_CALLS: 16
          CANDIDATE_EXTRACT_MAX_RUN_TOKENS: 250000

      - name: Crawl official member biographies and queue facts for review
        run: npx tsx scripts/ingest/member-biographies.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEMBER_BIO_PRIMARY_PROVIDER: openai
          MEMBER_BIO_MAX_MEMBERS: 12
          MEMBER_BIO_MAX_PAGES: 4
          MEMBER_BIO_MAX_INPUT_CHARS: 28000
          MEMBER_BIO_MAX_PROVIDER_CALLS: 24
          MEMBER_BIO_MAX_RUN_TOKENS: 250000

      - name: Ingest press releases
        run: npx tsx scripts/ingest/press-releases.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate delegation briefs
        run: npx tsx scripts/ingest/generate-briefs.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate events feed
        run: npx tsx scripts/ingest/generate-events.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Cleanup stuck runs
        if: always()
        run: npx tsx scripts/cleanup-stuck-runs.ts --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Health check
        if: always()
        run: npx tsx scripts/health-check.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Weekly ingest failed — ${new Date().toISOString().slice(0, 10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-failure',
              per_page: 1,
            });
            const body = [
              `Workflow: **${context.workflow}**`,
              `Run: ${run}`,
              `Triggered: \`${context.eventName}\``,
              ``,
              `Check the run logs and the [/health page](https://delegation-decoded.vercel.app/health) for details.`,
            ].join('\n');
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ingest-failure'],
              });
            }
