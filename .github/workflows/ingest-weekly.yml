# Runs every Sunday at 7 AM UTC (1 AM CT / 2 AM ET)
# Ingests slower-changing data: committees, campaign finance, press releases.
# Members now ingest daily (deaths and resignations can't wait for Sunday);
# the run here is a belt-and-suspenders second pass.
# Also regenerates AI delegation briefs and runs the health gate after ingestion.

name: Weekly data ingestion

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose the full weekly pipeline or an evidence-only recovery"
        type: choice
        options:
          - full
          - research
          - candidates
          - members
        default: full
      candidacy_id:
        description: "Optional exact candidacy ID for a targeted candidate recovery"
        required: false
        default: ""
      candidate_state:
        description: "Optional two-letter state filter for candidate research"
        required: false
        default: ""
      force_reextract:
        description: "Re-extract a targeted candidate even when source bytes are unchanged"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingest members
        if: ${{ inputs.mode == '' || inputs.mode == 'full' }}
        run: npx tsx scripts/ingest/members.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest committees
        if: ${{ inputs.mode == '' || inputs.mode == 'full' }}
        run: npx tsx scripts/ingest/committees.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Crawl verified campaign sites and publish quote-checked claims
        if: ${{ !cancelled() && inputs.mode != 'members' }}
        run: npx tsx scripts/ingest/candidate-sites.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_EXTRACT_PRIMARY_PROVIDER: openai
          CANDIDATE_EXTRACT_MAX_CANDIDATES: 8
          CANDIDATE_EXTRACT_MAX_PAGES: 5
          CANDIDATE_EXTRACT_MAX_INPUT_CHARS: 36000
          CANDIDATE_EXTRACT_MAX_OUTPUT_TOKENS: 4000
          CANDIDATE_EXTRACT_MAX_PROVIDER_CALLS: 16
          CANDIDATE_EXTRACT_MAX_RUN_TOKENS: 250000
          CANDIDATE_EXTRACT_CANDIDACY_ID: ${{ inputs.candidacy_id }}
          CANDIDATE_EXTRACT_STATE: ${{ inputs.candidate_state }}
          CANDIDATE_EXTRACT_FORCE: ${{ inputs.force_reextract }}

      - name: Crawl official member biographies and publish quote-checked facts
        if: ${{ !cancelled() && inputs.mode != 'candidates' }}
        run: npx tsx scripts/ingest/member-biographies.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEMBER_BIO_PRIMARY_PROVIDER: openai
          MEMBER_BIO_MAX_MEMBERS: 12
          MEMBER_BIO_MAX_PAGES: 4
          MEMBER_BIO_MAX_INPUT_CHARS: 28000
          MEMBER_BIO_MAX_OUTPUT_TOKENS: 3000
          MEMBER_BIO_MAX_PROVIDER_CALLS: 24
          MEMBER_BIO_MAX_RUN_TOKENS: 250000

      - name: Ingest campaign finance
        if: ${{ !cancelled() && (inputs.mode == '' || inputs.mode == 'full') }}
        run: npx tsx scripts/ingest/finance.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

      # The heaviest FEC consumer: ~5 requests per member across 535 sitting
      # members, against a gateway that publishes a 60-request budget. It is
      # not expected to cover the roster in one run. It processes members
      # stalest-first and stops at FINANCE_RUN_BUDGET_MS, so an interrupted
      # pass resumes rather than restarting and stranding the same tail.
      #
      # Budget (45m) plus the ~25m of steps above leaves headroom under the
      # job's 90m ceiling. step timeout-minutes is only a backstop: exceeding
      # it fails the step loudly instead of cancelling the whole job, which
      # would skip the health check and the issue-opener below.
      - name: Ingest finance committees and top contributors
        if: ${{ !cancelled() && (inputs.mode == '' || inputs.mode == 'full') }}
        timeout-minutes: 55
        run: npx tsx scripts/ingest/finance-committees.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FINANCE_RUN_BUDGET_MS: "2700000"

      # !cancelled() rather than a bare mode check: these two read from the
      # database and do not depend on the FEC steps above, so a finance
      # failure should not also cost the activity feed and the briefs.
      # (Press-release collection retired Aug 31, 2026 — statements point to
      # Capitol Releases. Its 16-19 minutes were what pushed this job past
      # the 90-minute ceiling.)
      - name: Generate delegation briefs
        if: ${{ !cancelled() && (inputs.mode == '' || inputs.mode == 'full') }}
        run: npx tsx scripts/ingest/generate-briefs.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate events feed
        if: ${{ !cancelled() && (inputs.mode == '' || inputs.mode == 'full') }}
        run: npx tsx scripts/ingest/generate-events.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # always(), not !cancelled(): the 90-minute job timeout cancels the job,
      # and these two are exactly what has to run when it does — the stranded
      # 'running' sync_log row is left by the step that got killed.
      - name: Cleanup stuck runs
        if: always()
        run: npx tsx scripts/cleanup-stuck-runs.ts --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Health check
        if: always()
        run: npx tsx scripts/health-check.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # A job-timeout reports as cancelled, not failed. Gating on failure()
      # alone let the 2026-08-02 timeout pass with no issue and no comment.
      - name: Open issue on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const status = process.env.JOB_STATUS || 'failure';
            const title = `Weekly ingest failed — ${new Date().toISOString().slice(0, 10)}`;
            // De-dupe only within the same workflow and day: reuse an open
            // issue whose title matches exactly, otherwise open a fresh dated
            // issue. Matching any open ingest-failure issue let one issue
            // accumulate months of unrelated failures across both workflows.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-failure',
              per_page: 100,
            });
            const existing = open.data.find((issue) => issue.title === title);
            const body = [
              `Workflow: **${context.workflow}**`,
              `Outcome: \`${status}\`${status === 'cancelled' ? ' — most likely the 90-minute job timeout, so later steps never ran.' : ''}`,
              `Run: ${run}`,
              `Triggered: \`${context.eventName}\``,
              ``,
              `Check the run logs and the [/health page](https://delegationdecoded.org/health) for details.`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ingest-failure'],
              });
            }
